name: Typecheck with Rzk (data-shape-fields branch)

# Controls when the workflow will run
on:
  # Triggers the workflow on push events
  push:
    branches:
      - main
      - diruniv
  # and pull request events
  pull_request:
    branches:
      - main
      - diruniv

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # rzk source: the data-shape-fields branch (modal-let rework + the layer
  # discipline), pinned by commit
  RZK_REPO: rzk-lang/rzk
  RZK_REF: ed87aa4909314c013d3628d02fbd3b19c8cf648c

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check formalisations
    steps:
      - name: Checkout formalisations
        uses: actions/checkout@v4

      - name: Checkout rzk (${{ env.RZK_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RZK_REPO }}
          ref: ${{ env.RZK_REF }}
          path: rzk-src

      - name: Set up Haskell/Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            rzk-src/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('rzk-src/stack.yaml.lock', 'rzk-src/stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build and install rzk
        working-directory: rzk-src
        run: stack install rzk:exe:rzk --local-bin-path "$HOME/.local/bin"

      - name: Typecheck Rzk files
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rzk" version
          "$HOME/.local/bin/rzk" typecheck --allow-holes
